<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Países</title>
    <style>
        /* Estilos básicos apenas para organizar as bandeiras em grade */
        #paises-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            font-family: sans-serif;
        }
        .card-pais:hover {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 150px;
            text-align: center;
            box-shadow: 6px 6px 8px rgba(138, 39, 39, 0.438);
        }

        .card-pais {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 150px;
            text-align: center;
            box-shadow: 6px 6px 8px rgba(0,0,0,0.1);
        }

        .card-pais img {
            width: 100%;
            height: auto;
            border: 1px solid #eee;
        }
        .card-pais h3 {
            font-size: 14px;
            margin: 10px 0 0 0;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>

    <div id="paises-container">Carregando países...</div>

    <script>
        // 2. FUNÇÃO ASYNC AWAIT ATUALIZADA
        async function carregarPaises() {
            const url = 'https://restcountries.com/v3.1/all?fields=name,flags';
            const container = document.getElementById('paises-container');

            // Garante que o container existe antes de tentar mudar o innerHTML
            if (!container) {
                console.error("Erro: O elemento #paises-container não foi encontrado no HTML.");
                return;
            }

            try {
                const resposta = await fetch(url);
                
                if (!resposta.ok) {
                    throw new Error(`Erro na API: ${resposta.status}`);
                }

                const paises = await resposta.json();

                // Ordena os países em ordem alfabética pelo nome comum
                paises.sort((a, b) => a.name.common.localeCompare(b.name.common));

                // Mapeia os dados para gerar as tags HTML
                const htmlGerado = paises.map(pais => {
            // Se o país não tiver uma descrição alternativa, criamos uma padrão
            const textoAlt = pais.flags.alt || "Este país não possui uma descrição detalhada da bandeira.";

            return `
                <div class="card-pais" 
                     data-alt="${textoAlt}"
                     onclick="mostrarAlt(this)" 
                     style="display: inline-block; margin: 15px; padding: 10px; border: 1px solid #ccc; text-align: center; cursor: pointer;">
                    
                    <img src="${pais.flags.svg}" alt="Bandeira de ${pais.name.common}" width="80">
                    <h3>${pais.name.common}</h3>
                </div>
            `;
        }).join('');

        container.innerHTML = htmlGerado;

    } catch (erro) {
        console.error(erro);
        container.innerHTML = '<p>Erro ao carregar dados.</p>';
    }
}

// Esta função é chamada quando o card recebe o clique
function mostrarAlt(elementoCard) {
    // Pegamos o valor que guardamos lá no 'data-alt' usando o dataset
    const mensagem = elementoCard.dataset.alt;
    
    
    // Exibe o texto em um alerta na tela
    
    alert(mensagem);
}

// Executa após o HTML carregar
document.addEventListener('DOMContentLoaded', carregarPaises);
    </script>
 
</body>
<div class="modal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Modal title</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p>Modal body text goes here.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary">Save changes</button>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

</html>
