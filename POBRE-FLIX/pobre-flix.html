<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pobre Flix</title>
</head>
<link rel="stylesheet" href="pobre-flix.css">
<script>
    function login(){
        let usuario = document.getElementById("usuario").value;
        let senha = document.getElementById("senha").value;

        if(usuario == "joao" && senha == "1234"){
            alert("Login Realizado com sucesso!");
            mostrarHome()
            esconderLogin()
        }
    }
    function logout(){
        let telaHome = document.getElementById("home").style.display = "none";
        let telaLogin = document.getElementById("login").style.display = "block";
    }
    function mostrarHome(){
        let telaHome = document.getElementById("home").style.display = "block";
    }
    function esconderLogin(){
        let telaLogin = document.getElementById("login").style.display = "none";
    }
</script>
<body>
    <section id="login" class="login">
        <h1>Pobre Flix</h1>
        <input type="text" id="usuario" placeholder="usuario"><br>
        <input type="text" id="senha" placeholder="senha"><br>
        <input type="button" value="ENTRAR" onclick="login()"><br>
    </section>
    <section id="home"  style="display: none;">
        <div class="home">
             <div class="telaHome">
            <h1>Escolha uma opção de Plano</h1><br>
            <input type="button" value="SAIR" onclick="logout()"><br>
        </div>
        <div class="telaHome1">
            <p>Basic <br> Inclui anúncios, com qualidade de imagem padrão. <br> R$5,00</p>
            <input type="button" class="button" value="ASSINAR">
        </div>
        <div class="telaHome2">
            <p id="telaHome1">Padrão <br> Sem anúncios, com qualidade de imagem padrão e até 2 telas simultâneas. <br> R$20,00</p>
            <input type="button" class="button" value="ASSINAR">
        </div>
        <div class="telaHome3">
            <p id="telaHome2">Premium <br> Sem anúncios, qualidade 4K Ultra HD, até 4 telas simultâneas e melhor qualidade de som. <br> R$30,00</p>
            <input type="button" class="button" value="ASSINAR">
        </div>
        </div>
       
    </section>
</body>
</html>
